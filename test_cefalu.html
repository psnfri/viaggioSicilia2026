<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Foto Cefalù</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #111; color: #fff; font-family: sans-serif; padding: 16px; }
h1 { font-size: 18px; margin-bottom: 16px; color: #C9A84C; }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.foto { border-radius: 10px; overflow: hidden; cursor: pointer; }
.foto img { width: 100%; height: 140px; object-fit: cover; display: block; }
.foto p { font-size: 11px; padding: 6px; background: #222; color: #aaa; }
#lb { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95);
      flex-direction: column; align-items: center; justify-content: center; padding: 20px; z-index: 999; }
#lb.open { display: flex; }
#lb img { max-width: 100%; max-height: 70vh; border-radius: 8px; object-fit: contain; }
#lb p { margin-top: 12px; font-size: 13px; color: #ccc; text-align: center; }
#lb button { margin-top: 16px; background: #C9A84C; border: none; color: #111;
              padding: 10px 24px; border-radius: 20px; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>
<h1>📸 Test Foto Cefalù</h1>
<div class="grid">
  <div class="foto" onclick="apri('https://images.unsplash.com/photo-1523906834658-6e24ef2386f9?w=800','Duomo di Cefalù')">
    <img src="https://images.unsplash.com/photo-1523906834658-6e24ef2386f9?w=400&q=80" alt="Duomo">
    <p>Duomo di Cefalù</p>
  </div>
  <div class="foto" onclick="apri('https://images.unsplash.com/photo-1533104816931-20fa691ff6ca?w=800','Vicoli di Cefalù')">
    <img src="https://images.unsplash.com/photo-1533104816931-20fa691ff6ca?w=400&q=80" alt="Vicoli">
    <p>Vicoli del centro</p>
  </div>
  <div class="foto" onclick="apri('https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=800','Cibo tipico siciliano')">
    <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=400&q=80" alt="Cibo">
    <p>Sarde a Beccafico</p>
  </div>
  <div class="foto" onclick="apri('https://images.unsplash.com/photo-1567529684892-09290a1b2d05?w=800','Granita alla mandorla')">
    <img src="https://images.unsplash.com/photo-1567529684892-09290a1b2d05?w=400&q=80" alt="Granita">
    <p>Granita alla mandorla</p>
  </div>
</div>
<div id="lb">
  <img id="lb-img" src="" alt="">
  <p id="lb-cap"></p>
  <button onclick="document.getElementById('lb').classList.remove('open')">✕ Chiudi</button>
</div>
<script>
function apri(src, cap) {
  document.getElementById('lb-img').src = src;
  document.getElementById('lb-cap').textContent = cap;
  document.getElementById('lb').classList.add('open');
}
</script>
</body>
</html>
