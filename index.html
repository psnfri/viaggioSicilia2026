<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3D5A4A">
<title>Sicilia 2026 — Diario di Viaggio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --verde:#3D5A4A;--verde2:#2C4236;--verde3:#1E3028;
  --salvia:#F0EDE6;--salvia2:#E8E4DB;--salvia3:#DDD8CE;
  --oro:#8B7355;--oro2:#C9A84C;
  --testo:#1E2D24;--testo2:#4A5A4E;--testo3:#7A8A7F;
}
html{scroll-behavior:smooth}
body{font-family:"DM Sans",sans-serif;background:var(--salvia);color:var(--testo);overflow-x:hidden;min-height:100vh}
.app-content{max-width:680px;margin:0 auto}

/* NAV GIORNI */
.day-nav{background:var(--verde);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.nav-btn{width:42px;height:42px;border-radius:50%;border:none;background:rgba(255,255,255,0.12);color:#E8DFC8;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.2s;flex-shrink:0}
.nav-btn:hover{background:rgba(255,255,255,0.22)}
.nav-btn:disabled{opacity:0.2;cursor:default}
.day-center{text-align:center;flex:1;padding:0 8px}
.day-label{font-size:11px;color:#A8C4B0;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
.day-title{font-family:"Playfair Display",serif;font-size:16px;color:#E8DFC8;line-height:1.2;font-style:italic}

/* LANG ROW */
.lang-row{background:var(--verde2);padding:7px 16px;display:flex;align-items:center;justify-content:space-between}
.lang-switch{display:flex;gap:4px;background:rgba(0,0,0,0.2);border-radius:20px;padding:3px}
.lang-btn{padding:4px 12px;border-radius:16px;font-size:11px;font-weight:500;cursor:pointer;border:none;background:transparent;color:rgba(232,223,200,0.5);letter-spacing:1px;text-transform:uppercase;font-family:"DM Sans",sans-serif}
.lang-btn.active{background:var(--oro2);color:var(--verde3)}
.day-counter{font-size:11px;color:#A8C4B0;letter-spacing:1px}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--salvia2);border-bottom:1px solid var(--salvia3)}
.stat{padding:8px 4px;text-align:center;border-right:1px solid var(--salvia3)}
.stat:last-child{border-right:none}
.stat .sv{font-size:14px;font-weight:500;color:var(--verde)}
.stat .sl{font-size:9px;color:var(--testo3);text-transform:uppercase;letter-spacing:0.5px;margin-top:1px}

/* HOTEL */
.hotel-box{background:var(--verde2);padding:12px 16px;display:flex;align-items:flex-start;gap:10px}
.hotel-ico{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;margin-top:1px}
.hotel-nome{font-size:13px;font-weight:500;color:#E8DFC8;margin-bottom:3px}
.hotel-det{font-size:11px;color:#A8C4B0;line-height:1.7;white-space:pre-line}

/* TIMELINE */
.timeline{padding:16px 16px 90px}
.tl-item{display:flex;gap:0}
.tl-left{display:flex;flex-direction:column;align-items:center;width:56px;flex-shrink:0}
.tl-time{font-size:15px;font-weight:500;color:var(--verde);margin-bottom:6px;white-space:nowrap}
.tl-dot{width:13px;height:13px;border-radius:50%;flex-shrink:0;z-index:1;border:2px solid var(--salvia)}
.tl-line{width:2px;flex:1;min-height:16px;margin:3px 0;opacity:0.3}
.tl-content{padding-bottom:22px;flex:1;padding-left:12px}
.tl-type{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:4px;font-weight:500}
.tl-name{font-family:"Playfair Display",serif;font-size:19px;color:var(--testo);line-height:1.25;margin-bottom:6px}
.tl-desc{font-size:14px;color:var(--testo2);line-height:1.7;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.chip{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--salvia3);color:var(--testo2)}

/* SEZIONI ESPANDIBILI */
.sec-box{border-radius:10px;margin-bottom:8px;overflow:hidden}
.sec-btn{width:100%;text-align:left;padding:10px 12px;border:none;cursor:pointer;display:flex;align-items:center;gap:8px;font-family:"DM Sans",sans-serif;font-size:13px;font-weight:500}
.sec-ico{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.sec-lbl{flex:1}
.sec-arr{font-size:16px;transition:transform 0.25s;color:var(--testo3);line-height:1}
.sec-btn.open .sec-arr{transform:rotate(90deg)}
.sec-body{display:none;padding:10px 12px 12px;font-size:14px;line-height:1.75;color:var(--testo2)}
.sec-body.open{display:block}
/* Cinema */
.sec-cinema .sec-btn{background:rgba(153,60,29,0.08);color:#6B3020}
.sec-cinema .sec-ico{background:rgba(153,60,29,0.15)}
.sec-cinema .sec-body{background:rgba(153,60,29,0.04)}
/* Cibo */
.sec-food .sec-btn{background:rgba(61,90,74,0.1);color:var(--verde)}
.sec-food .sec-ico{background:rgba(61,90,74,0.15)}
.sec-food .sec-body{background:rgba(61,90,74,0.05)}
.food-nome{font-size:15px;font-weight:500;color:var(--verde);margin-bottom:5px}
/* Ristoranti */
.sec-rist .sec-btn{background:var(--salvia2);color:var(--testo)}
.sec-rist .sec-ico{background:var(--salvia3)}
.sec-rist .sec-body{background:var(--salvia)}
.rist-row{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--salvia3)}
.rist-row:last-child{border-bottom:none;padding-bottom:0}
.rnum{width:22px;height:22px;border-radius:50%;background:var(--verde);color:#E8DFC8;font-size:10px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.rname{font-size:13px;font-weight:500;color:var(--testo);margin-bottom:2px}
.rdesc{font-size:12px;color:var(--testo3);line-height:1.4}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(44,66,54,0.97);backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,0.1);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;z-index:200;max-width:680px;margin:0 auto}
.bdots{display:flex;gap:5px;align-items:center}
.bdot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.2);transition:all 0.2s}
.bdot.active{background:var(--oro2);width:18px}
.bhint{font-size:11px;color:#A8C4B0;text-align:right;max-width:150px;line-height:1.4}

@media(max-width:380px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(2){border-right:none}
  .stat:nth-child(3){border-top:1px solid var(--salvia3)}
  .stat:nth-child(4){border-top:1px solid var(--salvia3)}
}
</style>
</head>

      <div class="day-title" id="dayTitle"></div>

    <button class="nav-btn" id="btnNext" onclick="changeDay(1)">&#8250;</button>

  <div class="lang-row">
    <div class="day-counter" id="dayCnt"></div>
    <div class="lang-switch">
      <button class="lang-btn active" onclick="setLang('it')">IT</button>
      <button class="lang-btn" onclick="setLang('es')">ES</button>

  <div class="stats" id="statsBar"></div>
  <div class="hotel-box" id="hotelBox"></div>
  <div class="timeline" id="timeline"></div>
  <div class="bottom-nav">
    <div class="bdots" id="bdots"></div>
    <div class="bhint" id="bhint"></div>
  </div>
</div>

let cur=0, lang='it';

function esc(s){
  if(!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function render(){
  const d=D[cur];
  document.getElementById('dayLabel').textContent = lang==='es' ? d.lbl_es : d.lbl_it;
  document.getElementById('dayTitle').textContent = lang==='es' ? d.ttl_es : d.ttl_it;
  document.getElementById('dayCnt').textContent = (cur+1)+' / '+D.length;
  document.getElementById('btnPrev').disabled = cur===0;
  document.getElementById('btnNext').disabled = cur===D.length-1;

  // Stats
  const stats = lang==='es' ? d.stats_es : d.stats_it;
  document.getElementById('statsBar').innerHTML = stats.map(s=>
    '<div class="stat"><div class="sv">'+esc(s.v)+'</div><div class="sl">'+esc(s.l)+'</div></div>'
  ).join('');

  // Hotel
  const h = lang==='es' ? d.hotel_es : d.hotel_it;
  document.getElementById('hotelBox').innerHTML =
    '<div class="hotel-ico">&#127968;</div><div><div class="hotel-nome">'+esc(h.nome)+'</div><div class="hotel-det">'+esc(h.det)+'</div></div>';

  // Timeline
  let tl='';
  d.stops.forEach((s,i)=>{
    const last=i===d.stops.length-1;
    const type = lang==='es' ? s.type_es : s.type_it;
    const name = lang==='es' ? s.name_es : s.name_it;
    const desc = lang==='es' ? s.desc_es : s.desc_it;
    const cinema = lang==='es' ? s.cinema_es : s.cinema_it;
    const food = lang==='es' ? s.food_es : s.food_it;
    const rist = lang==='es' ? s.rist_es : s.rist_it;
    const sid='s'+cur+'_'+i;

    tl+='<div class="tl-item">'
      +'<div class="tl-left">'
      +'<div class="tl-time">'+esc(s.time)+'</div>'
      +'<div class="tl-dot" style="background:'+s.dot+'"></div>'
      +(last?'':'<div class="tl-line" style="background:'+s.dot+'"></div>')
      +'</div>'
      +'<div class="tl-content">'
      +'<div class="tl-type" style="color:'+s.dot+'">'+esc(type)+'</div>'
      +'<div class="tl-name">'+esc(name)+'</div>'
      +'<div class="tl-desc">'+esc(desc)+'</div>';

    if(s.chips&&s.chips.length){
      tl+='<div class="chips">'+s.chips.map(c=>'<span class="chip">'+esc(c)+'</span>').join('')+'</div>';
    }

    if(cinema){
      const clbl = lang==='es' ? 'Para la cinéfila' : 'Per la cinefila';
      tl+='<div class="sec-box sec-cinema">'
        +'<button class="sec-btn" type="button" onclick="toggleSec(this)">'
        +'<div class="sec-ico">&#127916;</div><span class="sec-lbl">'+clbl+'</span><span class="sec-arr">&#8250;</span>'
        +'</button><div class="sec-body">'+esc(cinema)+'</div></div>';
    }
    if(food){
      const flbl = lang==='es' ? 'Qué probar' : 'Cosa assaggiare';
      tl+='<div class="sec-box sec-food">'
        +'<button class="sec-btn" type="button" onclick="toggleSec(this)">'
        +'<div class="sec-ico">&#127869;</div><span class="sec-lbl">'+flbl+'</span><span class="sec-arr">&#8250;</span>'
        +'</button><div class="sec-body"><div class="food-nome">'+esc(food.nome)+'</div>'+esc(food.desc)+'</div></div>';
    }
    if(rist&&rist.length){
      const rlbl = lang==='es' ? 'Dónde comer' : 'Dove mangiare';
      tl+='<div class="sec-box sec-rist">'
        +'<button class="sec-btn" type="button" onclick="toggleSec(this)">'
        +'<div class="sec-ico">&#127860;</div><span class="sec-lbl">'+rlbl+'</span><span class="sec-arr">&#8250;</span>'
        +'</button><div class="sec-body">'
        +rist.map((r,j)=>'<div class="rist-row"><div class="rnum">'+(j+1)+'</div><div><div class="rname">'+esc(r.n)+'</div><div class="rdesc">'+esc(r.d)+'</div></div></div>').join('')
        +'</div></div>';
    }
    tl+='</div></div>';
  });
  document.getElementById('timeline').innerHTML=tl;

  // Dots
  document.getElementById('bdots').innerHTML=D.map((_,i)=>
    '<div class="bdot'+(i===cur?' active':'')+'"></div>'
  ).join('');

  // Hint
  const nxt = cur<D.length-1 ? D[cur+1] : null;
  document.getElementById('bhint').innerHTML = nxt
    ? (lang==='es' ? 'Mañana:<br>' : 'Domani:<br>')+esc((lang==='es'?nxt.ttl_es:nxt.ttl_it).substring(0,28))+'…'
    : (lang==='es' ? '¡Fin del viaje! &#127968;' : 'Fine viaggio! &#127968;');

  window.scrollTo(0,0);
}

function changeDay(dir){
  const n=cur+dir;
  if(n<0||n>=D.length) return;
  cur=n; render();
}

function toggleSec(btn){
  event.stopPropagation();
  event.preventDefault();
  btn.classList.toggle('open');
  btn.nextElementSibling.classList.toggle('open');
}

function setLang(l){
  lang=l;
  document.querySelectorAll('.lang-btn').forEach((b,i)=>{
    b.classList.toggle('active',(i===0&&l==='it')||(i===1&&l==='es'));
  });
  localStorage.setItem('lang_v2',l);
  render();
}

const saved=localStorage.getItem('lang_v2');
if(saved){lang=saved; document.querySelectorAll('.lang-btn').forEach((b,i)=>{b.classList.toggle('active',(i===0&&lang==='it')||(i===1&&lang==='es'))});}
render();
</script>
