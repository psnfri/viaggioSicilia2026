<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3D5A4A">
<title>Sicilia 2026 — Diario di Viaggio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --verde:#3D5A4A;--verde2:#2C4236;--verde3:#1E3028;
  --salvia:#F0EDE6;--salvia2:#E8E4DB;--salvia3:#DDD8CE;
  --oro:#8B7355;--oro2:#C9A84C;
  --testo:#1E2D24;--testo2:#4A5A4E;--testo3:#7A8A7F;
  --verde-chiaro:#3D5A4A;--verde-menta:#1D9E75;--blu:#185FA5;--rosso:#993C1D;
}
html{scroll-behavior:smooth}
body{font-family:"DM Sans",sans-serif;background:var(--salvia);color:var(--testo);overflow-x:hidden;min-height:100vh}

/* ── HEADER NAV GIORNI ── */
.day-nav{
  background:var(--verde);
  padding:14px 16px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
}
.nav-btn{
  width:42px;height:42px;border-radius:50%;border:none;
  background:rgba(255,255,255,0.12);color:#E8DFC8;
  font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background 0.2s;flex-shrink:0;
}
.nav-btn:hover{background:rgba(255,255,255,0.22)}
.nav-btn:disabled{opacity:0.2;cursor:default}
.day-center{text-align:center;flex:1;padding:0 8px}
.day-label{font-size:11px;color:#A8C4B0;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
.day-title{font-family:"Playfair Display",serif;font-size:16px;color:#E8DFC8;line-height:1.2;font-style:italic}

/* ── LANG SWITCH ── */
.lang-row{background:var(--verde2);padding:6px 16px;display:flex;align-items:center;justify-content:space-between}
.lang-switch{display:flex;gap:4px;background:rgba(0,0,0,0.2);border-radius:20px;padding:3px}
.lang-btn{padding:4px 12px;border-radius:16px;font-size:11px;font-weight:500;cursor:pointer;border:none;background:transparent;color:rgba(232,223,200,0.5);letter-spacing:1px;text-transform:uppercase}
.lang-btn.active{background:var(--oro2);color:var(--verde3)}
.day-counter{font-size:11px;color:#A8C4B0;letter-spacing:1px}

/* ── STATS BAR ── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--salvia2);border-bottom:1px solid var(--salvia3)}
.stat{padding:8px 6px;text-align:center;border-right:1px solid var(--salvia3)}
.stat:last-child{border-right:none}
.stat .sv{font-size:14px;font-weight:500;color:var(--verde)}
.stat .sl{font-size:10px;color:var(--testo3);text-transform:uppercase;letter-spacing:0.5px;margin-top:1px}

/* ── HOTEL BOX ── */
.hotel-box{background:var(--verde2);padding:12px 16px;display:flex;align-items:flex-start;gap:10px}
.hotel-ico{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.hotel-info .hn{font-size:13px;font-weight:500;color:#E8DFC8;margin-bottom:3px}
.hotel-info .hd{font-size:11px;color:#A8C4B0;line-height:1.6;white-space:pre-line}

/* ── TIMELINE ── */
.timeline{padding:16px 16px 80px}
.tl-item{display:flex;gap:0;margin-bottom:0}
.tl-left{display:flex;flex-direction:column;align-items:center;width:56px;flex-shrink:0}
.tl-time{font-size:15px;font-weight:500;color:var(--verde);margin-bottom:6px;white-space:nowrap}
.tl-dot{width:13px;height:13px;border-radius:50%;flex-shrink:0;z-index:1;border:2px solid var(--salvia)}
.tl-line{width:2px;flex:1;min-height:16px;margin:3px 0}
.tl-content{padding-bottom:24px;flex:1;padding-left:12px}
.tl-type{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:4px;font-weight:500}
.tl-name{font-family:"Playfair Display",serif;font-size:19px;color:var(--testo);line-height:1.25;margin-bottom:6px}
.tl-desc{font-size:14px;color:var(--testo2);line-height:1.7;margin-bottom:10px}
.tl-chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.chip{font-size:12px;padding:3px 10px;border-radius:20px;background:var(--salvia3);color:var(--testo2)}

/* ── SEZIONI ESPANDIBILI ── */
.section-box{border-radius:10px;margin-bottom:10px;overflow:hidden}
.sec-toggle{width:100%;text-align:left;padding:10px 12px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-family:"DM Sans",sans-serif;font-size:13px;font-weight:500}
.sec-toggle .sec-ico{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.sec-toggle .sec-lbl{flex:1;margin-left:8px}
.sec-toggle .sec-arr{font-size:16px;transition:transform 0.25s;color:var(--testo3)}
.sec-toggle.open .sec-arr{transform:rotate(90deg)}
.sec-body{display:none;padding:10px 12px 12px;font-size:14px;line-height:1.7}
.sec-body.open{display:block}

.cinema-sec .sec-toggle{background:rgba(153,60,29,0.08);color:#6B3020}
.cinema-sec .sec-body{background:rgba(153,60,29,0.05);color:var(--testo2)}
.food-sec .sec-toggle{background:rgba(61,90,74,0.1);color:var(--verde)}
.food-sec .sec-body{background:rgba(61,90,74,0.06);color:var(--testo2)}
.food-sec .fname{font-size:15px;font-weight:500;color:var(--verde);margin-bottom:4px}
.rist-sec .sec-toggle{background:var(--salvia2);color:var(--testo)}
.rist-sec .sec-body{background:var(--salvia);color:var(--testo2)}

/* ── RISTORANTI ── */
.rist-item{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--salvia3)}
.rist-item:last-child{border-bottom:none;padding-bottom:0}
.rnum{width:22px;height:22px;border-radius:50%;background:var(--verde);color:#E8DFC8;font-size:11px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.rname{font-size:13px;font-weight:500;color:var(--testo);margin-bottom:2px}
.rdesc{font-size:12px;color:var(--testo3);line-height:1.4}

/* ── NAV FONDO GIORNI ── */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(61,90,74,0.97);backdrop-filter:blur(16px);
  border-top:1px solid rgba(255,255,255,0.1);
  padding:10px 20px;
  display:flex;align-items:center;justify-content:space-between;
  z-index:200;max-width:680px;margin:0 auto;
}
.bottom-dots{display:flex;gap:5px;align-items:center}
.bdot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.2);transition:all 0.2s}
.bdot.active{background:var(--oro2);width:18px}
.bottom-hint{font-size:11px;color:#A8C4B0;text-align:right;max-width:140px;line-height:1.4}

/* ── LINGUA ── */
[data-it],[data-es]{transition:opacity 0.15s}
body.es [data-it]{display:none!important}
body.es [data-es]{display:block}
body:not(.es) [data-es]{display:none!important}
body:not(.es) [data-it]{display:block}
span[data-it],span[data-es]{display:inline!important}
body.es span[data-it]{display:none!important}
body:not(.es) span[data-es]{display:none!important}

/* ── RESPONSIVE ── */
.app-content{max-width:680px;margin:0 auto}
@media(max-width:380px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(2){border-right:none}
  .stat:nth-child(3){border-top:1px solid var(--salvia3)}
  .stat:nth-child(4){border-top:1px solid var(--salvia3)}
}
</style>
</head>
<body>

<div class="app-content">

<!-- HEADER NAV -->
<div class="day-nav">
  <button class="nav-btn" id="btnPrev" onclick="changeDay(-1)" aria-label="Giorno precedente">‹</button>
  <div class="day-center">
    <div class="day-label" id="dayLabel">Giorno 1 · 27 Giugno</div>
    <div class="day-title" id="dayTitle">Andata verso la Sicilia</div>
  </div>
  <button class="nav-btn" id="btnNext" onclick="changeDay(1)" aria-label="Giorno successivo">›</button>
</div>

<!-- LANG + COUNTER -->
<div class="lang-row">
  <div class="day-counter" id="dayCounter">1 di 8</div>
  <div class="lang-switch">
    <button class="lang-btn active" onclick="setLang('it')">IT</button>
    <button class="lang-btn" onclick="setLang('es')">ES</button>
  </div>
</div>

<!-- STATS -->
<div class="stats" id="statsBar"></div>

<!-- HOTEL -->
<div class="hotel-box" id="hotelBox"></div>

<!-- TIMELINE -->
<div class="timeline" id="timeline"></div>

<!-- NAV BASSA -->
<div class="bottom-nav">
  <div class="bottom-dots" id="bottomDots"></div>
  <div class="bottom-hint" id="bottomHint"></div>
</div>

</div>

<script>
const DAYS = [{'lbl': 'Giorno 1 · 27 Giugno', 'ttl': 'Andata verso la Sicilia', 'stats': [{'v': '~565 km', 'l': 'Percorso'}, {'v': '~7h', 'l': 'Guida'}, {'v': '05:00', 'l': 'Partenza'}, {'v': 'San Paolo', 'l': 'Hotel'}], 'hotel': {'nome': 'Hotel San Paolo Palace — Palermo', 'dettaglio': 'CI: 27/06 · CO: 29/06 · 2 notti · Agoda · Hype\n156,12 € addebitati 22/06 · 8 € in struttura\n⚠ Disdetta entro 24/06 ore 23:59'}, 'stops': [{'time': '08:30', 'dot': '#8B7355', 'line': '#D8D0C4', 'type': 'Sosta · Calabria', 'name': 'Scilla — Chianalea & Castello Ruffo', 'desc': 'Borgo dei pescatori a picco sul mare — case raggiungibili solo in barca. Il Castello Ruffo risale al IX sec. Nel 1783 uno tsunami travolse 2.500 abitanti in fuga dalla spiaggia dopo un terremoto devastante.', 'cinema': "Kirk Douglas girò Ulisse (1954) di Mario Camerini con scene ispirate al mito di Scilla e Cariddi proprio in questa zona. Il nome del borgo viene dalla creatura a sei teste dell'Odissea di Omero.", 'food': {'nome': 'Pesce spada dello Stretto', 'desc': '3.000 anni di pesca invariata nello Stretto. La mattina presto i pescatori rientrano con il pesce spada fresco — cercate una friggitoria sul lungomare.'}, 'rist': [{'n': 'Friggitoria lungomare', 'd': 'Pesce spada fresco fritto o in involtino — il più tipico della zona'}], 'chips': ['Sosta 1h', 'Castello 3 €', 'Ingresso ore 09:00']}, {'time': '10:00', 'dot': '#5A7A6E', 'line': '#C8D8D0', 'type': 'Traghetto', 'name': 'Villa San Giovanni → Messina', 'desc': "Traghetto Caronte e Tourist, 35 minuti di traversata. Partenze ogni 20 minuti. L'auto sale a bordo. Vista sullo Stretto e sul profilo della Sicilia che si avvicina.", 'cinema': null, 'food': null, 'rist': [], 'chips': ['35 min', 'Auto a bordo', 'Ogni 20 min']}, {'time': '12:30', 'dot': '#3D5A4A', 'line': '#C8D8D0', 'type': 'Visita + Pranzo · UNESCO', 'name': 'Cefalù — Duomo & Lavatoio medievale', 'desc': 'Lavatoio medievale con 22 bocche a testa di leone — acqua gelata del fiume Cefalino. Il Cristo Pantocratore ha capelli normanni, barba araba e lineamenti greci: tre culture in un volto.', 'cinema': 'Cinema Paradiso (1988) di Giuseppe Tornatore — Oscar Miglior Film Straniero — fu girato tra questi vicoli. Tornatore è nato a Bagheria, 20 km da qui. La colonna sonora di Ennio Morricone è tra le più belle della storia del cinema.', 'food': {'nome': 'Sarde a Beccafico + Granita alla Mandorla', 'desc': 'Sarde ripiene di mollica, pinoli e uvetta. La granita alla mandorla con brioche è la merenda siciliana per eccellenza — fredda, cremosa, profumata.'}, 'rist': [{'n': 'Antares — lungomare', 'd': '4,0/5 · 1.533 recensioni TripAdvisor · cucina siciliana · economico'}, {'n': "Trattoria Chian'a Chiesa", 'd': "Piazza Sant'Ambrogio · pesce siciliano autentico · tel. 327 594 6051"}], 'chips': ['2h30', 'Duomo 3 €', 'Lavatoio gratuito']}, {'time': '16:30', 'dot': '#185FA5', 'line': null, 'type': 'Check-in · Palermo', 'name': 'Hotel San Paolo Palace', 'desc': "Piscina panoramica al 14° piano con vista mare mozzafiato. Cena libera al Mercato Ballarò o alla Vucciria — i mercati serali di Palermo sono tra i più vivi d'Italia.", 'cinema': 'Il Teatro Massimo — a 15 min a piedi — è dove Coppola girò la scena finale del Padrino III con Al Pacino e Sofia Coppola. Il teatro era chiuso da 23 anni, fu Coppola a riaprirlo.', 'food': {'nome': 'Arancina palermitana', 'desc': "Con la A! A Palermo è tonda, non conica. Ripiena di ragù. Al Ballarò la trovate fritta al momento per 2 €. Anche le panelle di ceci, lo sfincione, il pane ca' meusa."}, 'rist': [{'n': 'Mercato Ballarò', 'd': 'Street food · arancine, panelle, sfincione · ~15 € per due'}, {'n': 'Trattoria Ferro di Cavallo', 'd': 'Via Venezia 21 · storica · cucina palermitana · ~15 €/persona'}], 'chips': ['2 notti', 'Agoda · Hype', 'Check-in ore 16:30']}]}, {'lbl': 'Giorno 2 · 28 Giugno', 'ttl': 'Palermo — arte, mercati e mare', 'stats': [{'v': '~3h', 'l': 'Visite'}, {'v': '~3h', 'l': 'Mare'}, {'v': 'Ballarò', 'l': 'Pranzo'}, {'v': 'San Paolo', 'l': 'Hotel'}], 'hotel': {'nome': 'Hotel San Paolo Palace — Palermo', 'dettaglio': 'CI: 27/06 · CO: 29/06 · 2 notti · Agoda · Hype\n⚠ Disdetta entro 24/06 ore 23:59'}, 'stops': [{'time': '09:00', 'dot': '#8B7355', 'line': '#D8D0C4', 'type': 'Visita · UNESCO', 'name': 'Cappella Palatina & Palazzo Normanni', 'desc': "Mosaici dorati del 1130: struttura latina, soffitti arabi a muqarnas con danzatrici e suonatori coranici, mosaici bizantini. Guy de Maupassant la chiamò 'la più bella chiesa del mondo'. Prenotare online su federicosecondo.org.", 'cinema': "Il Gattopardo (1963) di Luchino Visconti — Palma d'Oro a Cannes, nella lista dei 12 film preferiti di Scorsese — fu girato a Palazzo Valguarnera-Gangi con Burt Lancaster, Alain Delon e Claudia Cardinale. Nel 2025 su Netflix la serie Il Gattopardo girata negli stessi luoghi.", 'food': {'nome': 'Street food a Ballarò', 'desc': "Arancina tonda (~2 €), panelle di ceci (~1 €), pane ca' meusa con milza (~3 €), sfincione. Budget pranzo per due: ~15 €."}, 'rist': [{'n': 'Trattoria Ferro di Cavallo', 'd': 'Via Venezia 21 · tel. 091 331835 · la più storica · ~15 €/persona'}, {'n': 'Osteria Mangia e Bevi', 'd': 'Vucciria · km0 · parmigiana top · gazebo · ~25 €'}], 'chips': ['2h', '~18,50 €', 'Prenotare online · federicosecondo.org']}, {'time': '11:30', 'dot': '#3D5A4A', 'line': '#C8D8D0', 'type': 'Centro storico + Pranzo', 'name': 'Quattro Canti · Cattedrale · Mercato Ballarò', 'desc': 'Quattro Canti è il cuore barocco di Palermo. La Cattedrale ha una facciata arabo-normanna con torri gotiche. Al Mercato Ballarò mangiate per strada — è il mercato più antico di Palermo, fondato dagli Arabi.', 'cinema': 'Ballarò e il centro storico sono stati location di The White Lotus (HBO/Sky) dal 2021 al 2025 — la serie più premiata degli ultimi anni. I vicoli, i palazzi nobiliari, il Teatro Massimo: tutto nella serie.', 'food': {'nome': 'Cannolo siciliano', 'desc': "La crema di ricotta fresca va consumata il giorno stesso — i cannoli let cur = 0;

function render(){
  const d = DAYS[cur];
  document.getElementById('dayLabel').textContent = d.lbl;
  document.getElementById('dayTitle').textContent = d.ttl;
  document.getElementById('dayCounter').textContent = (cur+1)+' di '+DAYS.length;
  document.getElementById('btnPrev').disabled = cur===0;
  document.getElementById('btnNext').disabled = cur===DAYS.length-1;

  // Stats
  document.getElementById('statsBar').innerHTML = d.stats.map(s=>
    '<div class="stat"><div class="sv">'+s.v+'</div><div class="sl">'+s.l+'</div></div>'
  ).join('');

  // Hotel
  document.getElementById('hotelBox').innerHTML =
    '<div class="hotel-ico">🏨</div><div class="hotel-info"><div class="hn">'+d.hotel.nome+'</div><div class="hd">'+d.hotel.dettaglio+'</div></div>';

  // Timeline
  let tlHtml = '';
  d.stops.forEach((s,i)=>{
    const isLast = i===d.stops.length-1;
    tlHtml += '<div class="tl-item"><div class="tl-left">'
      +'<div class="tl-time">'+s.time+'</div>'
      +'<div class="tl-dot" style="background:'+s.dot+'"></div>'
      +(isLast?'':'<div class="tl-line" style="background:'+s.dot+'22"></div>')
      +'</div><div class="tl-content">'
      +'<div class="tl-type" style="color:'+s.dot+'">'+s.type+'</div>'
      +'<div class="tl-name">'+s.name+'</div>'
      +'<div class="tl-desc">'+s.desc+'</div>';

    if(s.chips&&s.chips.length){
      tlHtml+='<div class="tl-chips">'+s.chips.map(c=>'<span class="chip">'+c+'</span>').join('')+'</div>';
    }

    const secId = 'sec_'+cur+'_'+i;

    if(s.cinema){
      tlHtml+='<div class="section-box cinema-sec">'
        +'<button class="sec-toggle" onclick="toggleSec(this)" type="button">'
        +'<div class="sec-ico">🎬</div><span class="sec-lbl" data-it>Per la cinefila</span><span class="sec-lbl" data-es style="display:none">Para la cinéfila</span>'
        +'<span class="sec-arr">›</span></button>'
        +'<div class="sec-body">'+s.cinema+'</div></div>';
    }
    if(s.food){
      tlHtml+='<div class="section-box food-sec">'
        +'<button class="sec-toggle" onclick="toggleSec(this)" type="button">'
        +'<div class="sec-ico">🍽️</div><span class="sec-lbl" data-it>Cosa assaggiare</span><span class="sec-lbl" data-es style="display:none">Qué probar</span>'
        +'<span class="sec-arr">›</span></button>'
        +'<div class="sec-body"><div class="fname">'+s.food.nome+'</div>'+s.food.desc+'</div></div>';
    }
    if(s.rist&&s.rist.length){
      tlHtml+='<div class="section-box rist-sec">'
        +'<button class="sec-toggle" onclick="toggleSec(this)" type="button">'
        +'<div class="sec-ico">🍴</div><span class="sec-lbl" data-it>Dove mangiare</span><span class="sec-lbl" data-es style="display:none">Dónde comer</span>'
        +'<span class="sec-arr">›</span></button>'
        +'<div class="sec-body">'
        +s.rist.map((r,j)=>'<div class="rist-item"><div class="rnum">'+(j+1)+'</div><div><div class="rname">'+r.n+'</div><div class="rdesc">'+r.d+'</div></div></div>').join('')
        +'</div></div>';
    }

    tlHtml+='</div></div>';
  });
  document.getElementById('timeline').innerHTML = tlHtml;

  // Dots
  document.getElementById('bottomDots').innerHTML = DAYS.map((_,i)=>
    '<div class="bdot'+(i===cur?' active':'')+'"></div>'
  ).join('');

  // Hint
  const hint = cur<DAYS.length-1 ? 'Domani:<br>'+DAYS[cur+1].ttl.substring(0,30) : 'Fine viaggio! 🏠';
  document.getElementById('bottomHint').innerHTML = hint;

  // Scorri in cima
  window.scrollTo(0,0);

  // Applica lingua corrente ai nuovi elementi
  applyLang();
}

function changeDay(dir){
  const n=cur+dir;
  if(n<0||n>=DAYS.length) return;
  cur=n; render();
}

function toggleSec(btn){
  event.stopPropagation();
  event.preventDefault();
  btn.classList.toggle('open');
  btn.nextElementSibling.classList.toggle('open');
}

// Lingua
let lang='it';
function setLang(l){
  lang=l;
  document.body.classList.toggle('es',l==='es');
  document.querySelectorAll('.lang-btn').forEach((b,i)=>{
    b.classList.toggle('active',(i===0&&l==='it')||(i===1&&l==='es'));
  });
  applyLang();
  localStorage.setItem('lang_v2',l);
}
function applyLang(){
  document.querySelectorAll('.sec-lbl[data-it]').forEach(el=>{
    el.style.display = lang==='es'?'none':'inline';
  });
  document.querySelectorAll('.sec-lbl[data-es]').forEach(el=>{
    el.style.display = lang==='es'?'inline':'none';
  });
}
const saved=localStorage.getItem('lang_v2');
if(saved) setLang(saved);

render();
</script>
</body>
</html>
